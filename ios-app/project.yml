name: KvNetflix
options:
  bundleIdPrefix: com.kvnetflix
  createIntermediateGroups: true
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    PRODUCT_NAME: "KV-Netflix"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_PREVIEWS: YES
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  KvNetflix:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: KvNetflix
      - path: Resources
    frameworks:
      - framework: AVKit.framework
      - framework: WebKit.framework
      - framework: MediaPlayer.framework
      - framework: AVFoundation.framework
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: "KV-Netflix"
        CFBundleIdentifier: "com.kvnetflix.ios"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: "darkBg"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: "com.kvnetflix.deeplink"
            CFBundleURLSchemes:
              - kvnetflix
              - streamflow
