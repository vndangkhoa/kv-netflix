name: Release APKs

on:
  push:
    tags:
      - 'v*'

env:
  JAVA_VERSION: "21"

jobs:
  # ====================
  # Build Android TV APK
  # ====================
  build-tv:
    name: Build TV APK
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'
      
      - name: Grant execute permission
        run: chmod +x android-tv/gradlew
      
      - name: Build Release APK
        run: |
          cd android-tv
          ./gradlew assembleRelease --no-daemon
      
      - name: Rename APK
        run: mv android-tv/app/build/outputs/apk/release/app-release.apk kv-netflix-tv-${{ github.ref_name }}.apk
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tv-apk
          path: kv-netflix-tv-${{ github.ref_name }}.apk

  # ====================
  # Build Android Mobile APK
  # ====================
  build-mobile:
    name: Build Mobile APK
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Grant execute permission
        run: chmod +x android-app/gradlew
      
      - name: Build Mobile APK
        run: |
          cd android-app
          ./gradlew assembleRelease --no-daemon
      
      - name: Rename APK
        run: mv android-app/app/build/outputs/apk/release/app-release.apk kv-netflix-mobile-${{ github.ref_name }}.apk
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-apk
          path: kv-netflix-mobile-${{ github.ref_name }}.apk

  # ====================
  # Build iOS IPA
  # ====================
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd ios-app
          xcodegen generate

      - name: Build Release Archive & .ipa
        run: |
          cd ios-app
          xcodebuild \
            -project KvNetflix.xcodeproj \
            -scheme KvNetflix \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/KvNetflix.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -r "$RUNNER_TEMP/KvNetflix.xcarchive/Products/Applications/KvNetflix.app" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qr "$GITHUB_WORKSPACE/kv-netflix-ios-${{ github.ref_name }}.ipa" Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: kv-netflix-ios-${{ github.ref_name }}.ipa

  # ====================
  # Create GitHub Release
  # ====================
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-tv, build-mobile, build-ios]
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4

      - name: Download TV APK
        uses: actions/download-artifact@v4
        with:
          name: tv-apk

      - name: Download Mobile APK
        uses: actions/download-artifact@v4
        with:
          name: mobile-apk

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.version.outputs.version }} - Android TV, Mobile & iOS App Update
          files: |
            kv-netflix-tv-${{ steps.version.outputs.version }}.apk
            kv-netflix-mobile-${{ steps.version.outputs.version }}.apk
            kv-netflix-ios-${{ steps.version.outputs.version }}.ipa
          generate_release_notes: true
          draft: false
          prerelease: false
